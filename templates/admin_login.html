<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration | Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { background-color: #0a0a0a; color: #fff; font-family: 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .login-card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 3rem; width: 100%; max-width: 400px; box-shadow: 0 0 40px rgba(139, 92, 246, 0.1); }
    .login-card h2 { font-weight: 600; margin-bottom: 1.5rem; text-align: center; }
    .form-control { background-color: #1a1a1a; border: 1px solid #333; color: #fff; padding: 0.75rem 1rem; }
    .form-control:focus { background-color: #1a1a1a; color: #fff; border-color: #8b5cf6; box-shadow: none; }
    .btn-primary { background-color: #8b5cf6; border: none; padding: 0.75rem; font-weight: 600; }
    .btn-primary:hover { background-color: #7c3aed; }
    .error { color: #ef4444; font-size: 0.9rem; margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #22d3ee, #ec4899); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1rem;">👤</div>
      <h2 class="mb-0" style="font-weight: 600;">Administration</h2>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label text-secondary" style="font-size: 0.85rem;">Email</label>
        <input type="email" class="form-control" name="email" placeholder="Votre email" required autofocus />
      </div>
      <div class="mb-3">
        <label class="form-label text-secondary" style="font-size: 0.85rem;">Mot de passe</label>
        <input type="password" class="form-control" name="password" placeholder="Votre mot de passe" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Se connecter</button>
      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}
    </form>
  </div>
</body>
</html>
