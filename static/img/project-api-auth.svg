<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#10162b"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ec4899" opacity="0.12"/>
    </pattern>
    <style>
      text { font-family: monospace; }
      .titre { fill: #22d3ee; font-size: 15px; letter-spacing: 4px; }
      .sub { fill: #9aa3bf; font-size: 11px; letter-spacing: 1px; }
      .node { fill: #10162b; stroke: url(#lg); stroke-width: 1.5; }
      .flow { fill: none; stroke: #22d3ee; stroke-width: 2.5; stroke-dasharray: 8 6; animation: flow 1.5s linear infinite; }
      .flow2 { fill: none; stroke: #8b5cf6; stroke-width: 2.5; stroke-dasharray: 8 6; animation: flow 1.5s linear infinite reverse; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .pill { fill: #0f172a; stroke: #a5e844; stroke-width: 1.5; }
      .pillText { fill: #a5e844; font-size: 11px; letter-spacing: 1px; }
      .badge { fill: #0f172a; stroke: #1e2440; stroke-width: 1.5; }
      .badgeText { fill: #e8ecf8; font-size: 11px; letter-spacing: 1px; }
      .lock { fill: none; stroke: #e8ecf8; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>
  <text x="400" y="40" text-anchor="middle" class="titre">API SECURISEE — AUTHENTIFICATION JWT</text>
  <text x="400" y="60" text-anchor="middle" class="sub">OAuth2 . RBAC . rate limiting . TLS</text>

  <rect class="node" x="50" y="175" width="130" height="80" rx="12"/>
  <text x="115" y="208" text-anchor="middle">CLIENT</text>
  <text x="115" y="232" text-anchor="middle" class="sub">app / navigateur</text>

  <rect class="node" x="330" y="160" width="140" height="110" rx="12" filter="url(#glow)"/>
  <rect x="372" y="180" width="26" height="22" rx="4" fill="#10162b" stroke="#e8ecf8" stroke-width="2"/>
  <path class="lock" d="M380 180 V172 a5 5 0 0 1 10 0 V180"/>
  <text x="400" y="222" text-anchor="middle">API</text>
  <text x="400" y="244" text-anchor="middle">GATEWAY</text>

  <rect class="node" x="600" y="115" width="140" height="65" rx="12"/>
  <text x="670" y="142" text-anchor="middle">SERVICE A</text>
  <text x="670" y="162" text-anchor="middle" class="sub">donnees</text>
  <rect class="node" x="600" y="235" width="140" height="65" rx="12"/>
  <text x="670" y="262" text-anchor="middle">SERVICE B</text>
  <text x="670" y="282" text-anchor="middle" class="sub">paiements</text>

  <line class="flow" x1="180" y1="205" x2="330" y2="205"/>
  <line class="flow2" x1="470" y1="205" x2="600" y2="148"/>
  <line class="flow2" x1="470" y1="225" x2="600" y2="268"/>

  <rect class="pill" x="195" y="105" width="240" height="40" rx="20"/>
  <circle cx="220" cy="125" r="5" fill="#a5e844"/>
  <text x="240" y="129" class="pillText">JWT — header.payload.signature</text>

  <rect class="badge" x="50" y="360" width="150" height="30" rx="15"/>
  <text x="125" y="379" text-anchor="middle" class="badgeText">OAuth2 . RBAC</text>
  <rect class="badge" x="215" y="360" width="150" height="30" rx="15"/>
  <text x="290" y="379" text-anchor="middle" class="badgeText">RATE LIMITING</text>
  <rect class="badge" x="380" y="360" width="150" height="30" rx="15"/>
  <text x="455" y="379" text-anchor="middle" class="badgeText">TLS 1.3</text>
  <rect class="badge" x="545" y="360" width="190" height="30" rx="15"/>
  <text x="640" y="379" text-anchor="middle" class="badgeText">CHIFFREMENT AES-256</text>
</svg>