<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141b36"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8b5cf6" opacity="0.18"/>
    </pattern>
    <style>
      .link { stroke: #8b5cf6; stroke-width: 2; stroke-dasharray: 7 7; animation: dash 1.6s linear infinite; opacity: .85; }
      .link2 { stroke: #22d3ee; stroke-width: 1.5; stroke-dasharray: 5 5; animation: dash 2.2s linear infinite reverse; opacity: .6; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .node { fill: #10162b; stroke: url(#lg); stroke-width: 1.5; }
      .gw { fill: #141b36; stroke: url(#lg); stroke-width: 2.5; filter: url(#glow); }
      text { font-family: monospace; fill: #e8ecf8; font-size: 13px; letter-spacing: 1px; }
      .sub { fill: #9aa3bf; font-size: 11px; }
      .titre { fill: #22d3ee; font-size: 15px; letter-spacing: 4px; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 400px 225px; }
      @keyframes pulse { 0%,100% { opacity: .12; transform: scale(1);} 50% { opacity: .28; transform: scale(1.06);} }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>
  <circle class="pulse" cx="400" cy="225" r="150" fill="#8b5cf6"/>
  <text x="400" y="40" text-anchor="middle" class="titre">ARCHITECTURE MICROSERVICES</text>
  <text x="400" y="60" text-anchor="middle" class="sub">8 services independants - evenementiel asynchrone</text>

  <line class="link" x1="345" y1="215" x2="150" y2="92"/>
  <line class="link" x1="400" y1="200" x2="400" y2="82"/>
  <line class="link" x1="455" y1="215" x2="650" y2="102"/>
  <line class="link" x1="455" y1="235" x2="695" y2="242"/>
  <line class="link" x1="455" y1="255" x2="650" y2="352"/>
  <line class="link" x1="400" y1="250" x2="400" y2="372"/>
  <line class="link" x1="345" y1="235" x2="150" y2="352"/>
  <line class="link" x1="345" y1="225" x2="150" y2="222"/>
  <line class="link2" x1="345" y1="200" x2="240" y2="130"/>
  <line class="link2" x1="455" y1="250" x2="555" y2="335"/>

  <rect class="gw" x="345" y="200" width="110" height="50" rx="12"/>
  <text x="400" y="230" text-anchor="middle" font-size="12">API GATEWAY</text>

  <rect class="node" x="95" y="70" width="110" height="44" rx="10"/>
  <text x="150" y="96" text-anchor="middle">AUTH</text>
  <rect class="node" x="345" y="60" width="110" height="44" rx="10"/>
  <text x="400" y="86" text-anchor="middle">ELEVES</text>
  <rect class="node" x="595" y="80" width="110" height="44" rx="10"/>
  <text x="650" y="106" text-anchor="middle">NOTES</text>
  <rect class="node" x="640" y="220" width="110" height="44" rx="10"/>
  <text x="695" y="246" text-anchor="middle">PAIEMENTS</text>
  <rect class="node" x="595" y="330" width="110" height="44" rx="10"/>
  <text x="650" y="356" text-anchor="middle">PROFESSEURS</text>
  <rect class="node" x="345" y="350" width="110" height="44" rx="10"/>
  <text x="400" y="376" text-anchor="middle">PLANNING</text>
  <rect class="node" x="95" y="330" width="110" height="44" rx="10"/>
  <text x="150" y="356" text-anchor="middle">NOTIFICATIONS</text>
  <rect class="node" x="95" y="200" width="110" height="44" rx="10"/>
  <text x="150" y="226" text-anchor="middle">MESSAGES</text>

  <text x="400" y="420" text-anchor="middle" class="sub">Docker . Kubernetes . Flask . PostgreSQL . Redis . RabbitMQ</text>
</svg>